<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Riwayat Unlock — Unlocker-AM (AsherMod)</title>

<!-- SEO Meta Tags -->
<meta name="description" content="Daftar riwayat aktivasi dan unlock akun Alight Motion Premium oleh AsherMod." />
<meta name="robots" content="noindex, nofollow" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="assets/image/favicon.png" />
<link rel="apple-touch-icon" href="assets/image/favicon.png" />

<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
  <!-- Header Navigasi -->
  <header class="header">
    <div class="history-nav">
      <a href="index.html" class="btn-back">
        <i data-lucide="arrow-left"></i> Kembali
      </a>
      <div class="brand-badge">
        <i data-lucide="history" class="badge-icon"></i>
        <span>Riwayat</span>
      </div>
    </div>
    <h1>Riwayat <span class="gradient-text">Unlock</span></h1>
    <p class="header-subtitle">Daftar akun yang berhasil diaktifkan di perangkat ini</p>
  </header>

  <!-- Control Bar -->
  <div class="history-control-bar">
    <span class="history-count" id="historyCount">0 Akun</span>
    <button class="btn-clear-all" id="btnClearAll" onclick="clearAllHistory()" style="display: none;">
      <i data-lucide="trash-2"></i> Hapus Semua
    </button>
  </div>

  <!-- Container List Riwayat -->
  <div id="historyList" class="history-list">
    <!-- Item riwayat akan dimasukkan via JavaScript -->
  </div>

  <!-- State Kosong -->
  <div id="emptyState" class="card empty-card" style="display: none;">
    <div class="empty-icon">
      <i data-lucide="inbox"></i>
    </div>
    <h3>Belum Ada Riwayat</h3>
    <p>Akun yang berhasil kamu unlock akan tersimpan otomatis di sini.</p>
    <a href="index.html" class="btn-primary" style="margin-top: 16px; text-decoration: none;">
      <span>Unlock Akun Sekarang</span>
      <i data-lucide="zap"></i>
    </a>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script src="history.js"></script>
</body>
</html>
