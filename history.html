<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Riwayat Unlock — Unlocker AM</title>
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
  <header class="header">
    <p class="brand">unlocker-am</p>
    <h1>Riwayat <span class="gradient-text">Unlock</span></h1>
  </header>

  <div class="card history-card">
    <div class="history-head">
      <h2 class="card-title" style="margin: 0;">Daftar Akun</h2>
      <button class="btn-text" onclick="clearHistory()">Hapus Semua</button>
    </div>
    <p class="card-desc">Tersimpan di perangkat ini (bukan di server).</p>
    
    <div id="historyList" class="history-list">
      <p class="history-empty">Belum ada history.</p>
    </div>
  </div>

  <div style="text-align: center; margin-top: 24px;">
    <a href="/" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 12px 24px; width: auto;">
      Kembali ke Beranda
    </a>
  </div>
</div>

<!-- toast -->
<div id="toast" class="toast"></div>

<script src="history.js"></script>
</body>
</html>
